<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Pipeline</title>
<link rel="stylesheet" href="/styles.css">
<style>
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .jobcard { background: var(--color-surface); padding: 12px 16px 14px; cursor: pointer; position: relative; }
  .jobcard:hover { box-shadow: var(--shadow-md); }
  .qdel { border: none; background: transparent; color: var(--color-neutral-500); cursor: pointer; font-size: 13px; line-height: 1; padding: 2px 6px; opacity: 0; transition: opacity .1s; }
  .jobcard:hover .qdel, .table tbody tr:hover .qdel { opacity: 1; }
  .qdel:hover { color: var(--color-accent); }
  .col-drop { transition: background .12s; }
  .col-drop.over { background: color-mix(in srgb, var(--color-accent) 8%, transparent); }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--color-text); color: var(--color-bg); padding: 12px 18px; font-size: 13px; box-shadow: var(--shadow-lg); z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const STATUSES = ["interested", "applied", "interviewing", "offer", "rejected"];
const APP = { view: "board", boardView: "board", jobs: [], stats: {}, job: null, resume: null, rtab: "preview", query: "", tailoring: false, tailorStage: "", ingestDays: 3, ingesting: false, ingestMsg: "",
  // Setup pane. `setup` is the whole /api/settings blob; null until first loaded.
  setup: null, setupTab: "key", setupBusy: "", scan: { running: false, senders: [], msg: "", show: "likely" },
  rescoring: false, rescoreMsg: "",
  // Score bands, overwritten from the saved rubric once settings load. The board
  // colours jobs by these, so "strong match" means the same thing in the UI as it
  // does in the scoring prompt — otherwise raising strong_min to 85 would leave
  // the board still painting 75s as strong.
  bands: { strong: 75, possible: 50 } };

const $ = (id) => document.getElementById(id);
const val = (id) => ($(id) ? $(id).value.trim() : "");
// "a, b , c" -> ["a","b","c"]. Comma-separated text inputs are the lightest way to
// edit a short list without building a tag widget.
const listVal = (id) => val(id).split(",").map(s => s.trim()).filter(Boolean);
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (path, opts) => { const r = await fetch(path, opts); if (!r.ok) throw new Error(await r.text()); return r.status === 204 ? null : r.json(); };
const jsonReq = (method, body) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const scoreColor = (f) => f == null ? "var(--color-neutral-500)" : f >= APP.bands.strong ? "var(--color-accent)" : f >= APP.bands.possible ? "var(--color-neutral-900)" : "var(--color-neutral-600)";
const scoreLabel = (f) => f == null ? "–" : f;

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2800); }

// --- data loads -------------------------------------------------------------
async function loadBoard() {
  [APP.jobs, APP.stats] = await Promise.all([api("/api/jobs"), api("/api/stats")]);
  APP.view = "board"; render();
}
async function openJob(id) {
  APP.job = await api(`/api/jobs/${id}`);
  APP.resume = APP.job.resumes.length ? await api(`/api/resumes/${APP.job.resumes[0].id}`) : null;
  APP.rtab = "preview"; APP.view = "job"; render();
}
async function selectResume(rid) { APP.resume = await api(`/api/resumes/${rid}`); APP.rtab = "preview"; render(); }
function go(view) { APP.view = view; render(); if (view === "board") loadBoard(); if (view === "setup") loadSetup(); }

// Settings drive the first-run banner and the board's score colours, so they are
// fetched on boot, not only when the Setup pane is opened.
async function loadSetup(rerender = true) {
  APP.setup = await api("/api/settings");
  APP.bands = { strong: APP.setup.rubric.strong_min, possible: APP.setup.rubric.possible_min };
  if (rerender) render();
}
function setupIncomplete() {
  const n = APP.setup && APP.setup.needs;
  return n ? Object.keys(n).filter(k => n[k]) : [];
}

// --- actions ----------------------------------------------------------------
async function setStatus(id, status) {
  await api(`/api/jobs/${id}/status`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }) });
  const j = APP.jobs.find(x => x.id === id); if (j) j.status = status;
  if (APP.job && APP.job.id === id) APP.job.status = status;
  toast(`Moved to ${status}.`); render();
}
async function saveJd(id) {
  const jd = $("jdText").value;
  const d = await api(`/api/jobs/${id}/jd`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jd_text: jd }) });
  APP.job.jd_text = jd; toast(`JD saved (${d.chars} chars).`);
}
async function approve(rid) { await api(`/api/resumes/${rid}/approve`, { method: "POST" }); toast("Approved."); await openJob(APP.job.id); }
function download(rid) { window.location = `/api/resumes/${rid}/docx`; }

async function tailor(id) {
  APP.tailoring = true;
  const stages = ["Drafting from fact bank…", "Grounding check…", "Rendering .docx…"];
  let i = 0; APP.tailorStage = stages[0]; render();
  const timer = setInterval(() => { i = Math.min(i + 1, stages.length - 1); APP.tailorStage = stages[i]; const el = $("tailorStage"); if (el) el.textContent = stages[i]; }, 7000);
  try {
    const res = await api(`/api/jobs/${id}/tailor`, { method: "POST" });
    const fit = res.pages === 1 ? "1 page" : `${res.pages} pages`;
    toast(`v${res.version} drafted — ${fit} · ${res.grounded ? "grounded" : res.flagged.length + " flagged"}`);
  } catch (e) { toast("Tailoring failed — check the server console."); }
  finally { clearInterval(timer); APP.tailoring = false; await openJob(id); }
}

async function saveNewJob() {
  const g = (k) => $("f_" + k).value.trim();
  if (!g("company") || !g("title")) { toast("Company and title are required."); return; }
  const body = { company: g("company"), title: g("title"), url: g("url") || null, location: g("location") || null, salary: g("salary") || null, deadline: g("deadline") || null, jd_text: $("f_jd").value };
  toast("Saving & fit-scoring…");
  const job = await api("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  await openJob(job.id);
}

async function runPipeline() {
  try {
    await api("/api/ingest", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ days: APP.ingestDays }) });
  } catch (e) {
    let msg = "Could not start ingest.";
    try { msg = JSON.parse(e.message).detail || msg; } catch (_) {}
    toast(msg); return;
  }
  APP.ingesting = true; APP.ingestMsg = "starting…"; render();
  const timer = setInterval(async () => {
    const s = await api("/api/ingest/status");
    APP.ingestMsg = (s.message || "running…") + (s.scored ? ` · ${s.scored} new scored` : "");
    if (APP.view === "board") render();
    if (!s.running && s.done) {
      clearInterval(timer); APP.ingesting = false;
      toast(s.error ? "Ingest error: " + s.error : `Ingest done — ${s.scored} new job(s) scored`);
      await loadBoard();
    }
  }, 1500);
}

async function archiveJob(id) {
  if (!confirm("Delete this role and any drafted resumes? This can't be undone.")) return;
  await api(`/api/jobs/${id}`, { method: "DELETE" });
  toast("Role deleted."); go("board");
}

async function quickDelete(id) {
  if (!confirm("Delete this role and any resumes attached to it?")) return;
  await api(`/api/jobs/${id}`, { method: "DELETE" });
  toast("Role deleted."); await loadBoard();
}

function pickUpload(jobId) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".docx,.pdf";
  inp.onchange = async () => {
    if (!inp.files.length) return;
    const fd = new FormData(); fd.append("file", inp.files[0]);
    toast("Uploading…");
    try {
      const res = await fetch(`/api/jobs/${jobId}/resume/upload`, { method: "POST", body: fd });
      if (!res.ok) throw new Error(await res.text());
      toast("Resume uploaded."); await openJob(jobId);
    } catch (e) { toast("Upload failed — use a .docx or .pdf."); }
  };
  inp.click();
}

// --- render -----------------------------------------------------------------
function render() {
  if (APP.view === "job") $("app").innerHTML = header() + viewJob();
  else if (APP.view === "add") $("app").innerHTML = header() + viewAdd();
  else if (APP.view === "setup") { $("app").innerHTML = header() + viewSetup(); hydrateDocs(); }
  else $("app").innerHTML = header() + banner() + viewBoard();
  if (APP.view === "board" && APP.boardView === "board") wireDrag();
  if (APP.view === "setup" && APP.setupTab === "rubric") syncWeights();
}

function header() {
  const todo = setupIncomplete().length;
  return `<div class="nav" style="position:sticky;top:0;z-index:20;background:var(--color-bg)">
    <div class="nav-brand">JOB&nbsp;PIPELINE</div>
    <div style="display:flex;gap:14px;margin-right:auto">
      <button class="btn btn-ghost" style="text-transform:uppercase;font-size:13px;letter-spacing:.06em" onclick="go('board')">Board</button>
      <button class="btn btn-ghost" style="text-transform:uppercase;font-size:13px;letter-spacing:.06em" onclick="go('add')">Add role</button>
      <button class="btn btn-ghost" style="text-transform:uppercase;font-size:13px;letter-spacing:.06em" onclick="go('setup')">Setup${todo ? ` <span class="tag tag-accent" style="margin-left:6px">${todo}</span>` : ""}</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)">
      <span style="width:7px;height:7px;background:var(--color-accent);display:block"></span>
      <span>api :8000 · ${APP.stats.jobs ?? "–"} roles</span>
    </div>
  </div>`;
}

// First-run banner. Named rather than counted, because "set your API key" and
// "you're still on the demo fact bank" need completely different reactions — the
// second one silently produces plausible resumes for a person who doesn't exist.
const NEEDS_COPY = {
  key: ["No API key", "Nothing can score or draft until DeepSeek has a key."],
  profile: ["Profile is the demo persona", "Fit scores are being judged against someone else's CV."],
  fact_bank: ["Fact bank is the demo persona", "Tailored resumes would be grounded in facts that aren't yours."],
  sources: ["No email sources chosen", "Ingest falls back to the built-in job-board list."],
};

function banner() {
  const needs = setupIncomplete();
  if (!needs.length) return "";
  return `<div style="border-bottom:2px solid var(--color-accent);background:var(--color-accent-100);padding:14px 20px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span style="font-family:var(--font-heading);font-weight:800;font-size:14px">Finish setup</span>
      <span style="font-size:12.5px;color:var(--color-neutral-800)">${needs.length} item${needs.length > 1 ? "s" : ""} left before this app is really yours.</span>
      <button class="btn btn-primary" style="margin-left:auto" onclick="go('setup')">Open Setup</button>
    </div>
    <ul style="margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--color-neutral-800)">
      ${needs.map(k => `<li><strong>${esc(NEEDS_COPY[k][0])}</strong> — ${esc(NEEDS_COPY[k][1])}</li>`).join("")}
    </ul>
  </div>`;
}

const kicker = (t) => `<div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)">${t}</div>`;

function filtered() {
  const q = APP.query.trim().toLowerCase();
  if (!q) return APP.jobs;
  return APP.jobs.filter(j => `${j.company} ${j.title} ${j.track || ""}`.toLowerCase().includes(q));
}

// Update ONLY the list + count on each keystroke — a full render() would rebuild
// the whole page and steal focus from the search input after one character.
function filterList(v) {
  APP.query = v;
  const rows = filtered();
  const list = $("boardlist");
  if (list) {
    list.innerHTML = APP.boardView === "board" ? board(rows) : table(rows);
    if (APP.boardView === "board") wireDrag();
  }
  const cnt = $("filtercount");
  if (cnt) cnt.textContent = `${rows.length} of ${APP.jobs.length}`;
}

function resumeTag(j) {
  if (j.any_approved) return `<span class="tag tag-outline">approved</span>`;
  if (j.resume_count) return `<span class="tag tag-neutral">${j.resume_count} draft${j.resume_count > 1 ? "s" : ""}</span>`;
  return "";
}

function viewBoard() {
  const s = APP.stats;
  const health = [
    { label: "Roles", value: s.jobs, note: "in the board" },
    { label: "Scored", value: s.scored, note: "fit-scored" },
    { label: "Top fit", value: s.top_fit, note: "best match" },
    { label: "Drafts", value: s.drafts, note: `${s.roles_with_drafts} roles` },
    { label: "Approved", value: s.approved, note: "ready to send" },
  ];
  const rows = filtered();
  const strip = `<div style="display:grid;grid-template-columns:repeat(5,1fr);border-bottom:2px solid var(--color-divider)">
    ${health.map(h => `<div style="padding:14px 20px;border-right:1px solid var(--color-divider)">
      ${kicker(h.label)}
      <div style="font-family:var(--font-heading);font-weight:800;font-size:26px;line-height:1.1;margin-top:4px">${h.value ?? "–"}</div>
      <div style="font-size:11px;color:var(--color-neutral-700)">${h.note}</div>
    </div>`).join("")}
  </div>`;

  const toolbar = `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:12px 20px;border-bottom:1px solid var(--color-divider)">
    <div class="seg">
      <label class="seg-opt"><input type="radio" name="bv" ${APP.boardView === "board" ? "checked" : ""} onchange="APP.boardView='board';render()"><span>Board</span></label>
      <label class="seg-opt"><input type="radio" name="bv" ${APP.boardView === "table" ? "checked" : ""} onchange="APP.boardView='table';render()"><span>Table</span></label>
    </div>
    <input class="input" style="flex:1 1 180px;max-width:280px" placeholder="filter company / title / track" value="${esc(APP.query)}" oninput="filterList(this.value)">
    <span id="filtercount" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)">${rows.length} of ${APP.jobs.length}</span>
    <button class="btn btn-primary" style="margin-left:auto" onclick="go('add')">Add role manually</button>
  </div>`;

  const ingestRow = `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:10px 20px;border-bottom:1px solid var(--color-divider)">
    <span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)">Ingest window</span>
    <div class="seg">
      ${[1, 2, 3, 4, 5, 6, 7].map(d => `<label class="seg-opt"><input type="radio" name="iw" ${APP.ingestDays === d ? "checked" : ""} onchange="APP.ingestDays=${d};render()" ${APP.ingesting ? "disabled" : ""}><span>${d}d</span></label>`).join("")}
    </div>
    <span style="flex:0 1 auto;font-size:11.5px;color:var(--color-neutral-600)">${APP.ingesting ? "▸ " + esc(APP.ingestMsg) : `Gmail query newer_than:${APP.ingestDays}d · scores only new postings`}</span>
    <button class="btn btn-secondary" style="margin-left:auto" onclick="runPipeline()" ${APP.ingesting ? "disabled" : ""}>${APP.ingesting ? "Ingesting…" : "Run pipeline"}</button>
  </div>`;

  return strip + toolbar + ingestRow + `<div id="boardlist">${APP.boardView === "board" ? board(rows) : table(rows)}</div>`;
}

function board(rows) {
  const byStatus = Object.fromEntries(STATUSES.map(s => [s, []]));
  rows.forEach(j => (byStatus[j.status] || byStatus.interested).push(j));
  return `<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start">
    ${STATUSES.map(st => `<div class="col-drop" data-status="${st}" style="border-right:1px solid var(--color-divider);min-height:70vh;padding-bottom:40px">
      <div style="display:flex;align-items:baseline;gap:8px;padding:14px 16px 10px;border-bottom:2px solid var(--color-divider);position:sticky;top:57px;background:var(--color-bg);z-index:10">
        <span style="font-family:var(--font-heading);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase">${st}</span>
        <span style="font-size:12px;color:var(--color-neutral-700);margin-left:auto">${byStatus[st].length}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:1px;padding:1px 0">
        ${byStatus[st].map(j => card(j)).join("")}
      </div>
    </div>`).join("")}
  </div>`;
}

function card(j) {
  return `<div class="jobcard" draggable="true" data-id="${j.id}" onclick="openJob(${j.id})" style="border-left:3px solid ${scoreColor(j.fit_score)}">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <div style="flex:1;min-width:0">
        <div style="font-family:var(--font-heading);font-weight:800;font-size:14px;line-height:1.2">${esc(j.company)}</div>
        <div style="font-size:12.5px;color:var(--color-neutral-800);margin-top:2px">${esc(j.title)}</div>
      </div>
      <div style="text-align:right;line-height:1">
        <div style="font-family:var(--font-heading);font-weight:800;font-size:22px;color:${scoreColor(j.fit_score)}">${scoreLabel(j.fit_score)}</div>
        <div style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600)">fit</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:4px;margin-top:10px">
      <div style="display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0">
        ${j.track ? `<span class="tag tag-neutral">${esc(j.track)}</span>` : ""}
        ${j.location ? `<span class="tag tag-neutral">${esc(j.location)}</span>` : ""}
        ${resumeTag(j)}
      </div>
      <button class="qdel" title="Delete role" onclick="event.stopPropagation();quickDelete(${j.id})">✕</button>
    </div>
  </div>`;
}

function table(rows) {
  return `<div style="padding:0 20px 60px"><table class="table">
    <thead><tr><th style="width:34px">#</th><th>Company</th><th>Role</th><th>Track</th><th>Location</th><th style="text-align:right">Fit</th><th>Status</th><th>Resume</th><th></th></tr></thead>
    <tbody>
      ${rows.map(j => `<tr style="cursor:pointer" onclick="openJob(${j.id})">
        <td style="color:var(--color-neutral-600);font-size:12px">${j.id}</td>
        <td style="font-weight:600">${esc(j.company)}</td>
        <td>${esc(j.title)}</td>
        <td style="font-size:12.5px;color:var(--color-neutral-800)">${esc(j.track || "")}</td>
        <td style="font-size:12.5px;color:var(--color-neutral-800)">${esc(j.location || "")}</td>
        <td style="text-align:right;font-family:var(--font-heading);font-weight:800;color:${scoreColor(j.fit_score)}">${scoreLabel(j.fit_score)}</td>
        <td><span class="tag tag-neutral">${esc(j.status)}</span></td>
        <td>${resumeTag(j) || '<span style="color:var(--color-neutral-500);font-size:12px">—</span>'}</td>
        <td style="text-align:right;white-space:nowrap"><button class="qdel" title="Delete role" onclick="event.stopPropagation();quickDelete(${j.id})">✕</button> <span style="color:var(--color-accent);font-weight:800">→</span></td>
      </tr>`).join("")}
    </tbody>
  </table></div>`;
}

function wireDrag() {
  document.querySelectorAll(".jobcard").forEach(el => {
    el.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", el.dataset.id));
  });
  document.querySelectorAll(".col-drop").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => { e.preventDefault(); col.classList.remove("over"); setStatus(+e.dataTransfer.getData("text/plain"), col.dataset.status); });
  });
}

// --- job detail -------------------------------------------------------------
function viewJob() {
  const j = APP.job;
  const tags = [j.track, j.location, j.salary].filter(Boolean).map(t => `<span class="tag tag-neutral">${esc(t)}</span>`).join("");
  const statusSeg = `<div class="seg">${STATUSES.map(s => `<label class="seg-opt"><input type="radio" name="st" ${j.status === s ? "checked" : ""} onchange="setStatus(${j.id},'${s}')"><span>${s}</span></label>`).join("")}</div>`;
  return `<div>
    <div style="padding:16px 20px 0"><button class="btn btn-ghost" style="padding-left:0" onclick="go('board')">← Board</button></div>
    <div style="display:flex;align-items:flex-start;gap:24px;padding:6px 20px 18px;border-bottom:2px solid var(--color-divider)">
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent)">${esc(j.source)} · job #${j.id}</div>
        <h2 style="margin:6px 0 2px">${esc(j.title)}</h2>
        <div style="font-size:16px;color:var(--color-neutral-800)">${esc(j.company)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center">
          ${tags}
          ${j.url ? `<a class="tag tag-outline" href="${esc(j.url)}" target="_blank" rel="noreferrer">Open posting ↗</a>` : ""}
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-family:var(--font-heading);font-weight:800;font-size:56px;line-height:1;color:${scoreColor(j.fit_score)}">${scoreLabel(j.fit_score)}</div>
        <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)">fit score</div>
      </div>
      <div style="width:190px;display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-primary btn-block" onclick="tailor(${j.id})" ${APP.tailoring ? "disabled" : ""}>${APP.tailoring ? "Tailoring…" : (j.resumes.length ? "Re-tailor resume" : "Tailor resume")}</button>
        <button class="btn btn-secondary btn-block" onclick="archiveJob(${j.id})">Delete role</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--color-divider)">
      ${kicker("Status")} ${statusSeg}
      <span style="margin-left:auto;font-size:11px;color:var(--color-neutral-600)">applications.db row ${j.id}</span>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,44fr) minmax(0,56fr);align-items:start">

function grounding(r) {
  const claims = (r.grounding && r.grounding.claims) || [];
  if (!claims.length) return `<div class="text-muted" style="padding:20px">No grounding report for this version.</div>`;
  const ok = claims.filter(c => c.supported).length;
  const stat = [{ l: "Claims", v: claims.length, c: "var(--color-text)" }, { l: "Supported", v: ok, c: "var(--color-neutral-900)" }, { l: "Flagged", v: claims.length - ok, c: (claims.length - ok) ? "var(--color-accent)" : "var(--color-neutral-900)" }];
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--color-divider);margin-bottom:14px">

      ${claims.map(c => { const edge = c.supported ? "var(--color-neutral-400)" : "var(--color-accent)"; return `<div style="background:var(--color-surface);padding:12px 14px;border-left:3px solid ${edge}">
        <div style="display:flex;gap:10px;align-items:flex-start">
          <span style="font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:${edge};min-width:96px">${c.supported ? "Supported" : "Unsupported"}</span>

}

// --- Setup ------------------------------------------------------------------
// Panes render once per tab switch and read their values back off the DOM on
// Save (the same approach viewAdd() uses). A re-render per keystroke would steal
// focus from whatever field you were typing in — the bug filterList() works
// around on the board.

const SETUP_TABS = [
  ["key", "API key"],
  ["profile", "Profile & fact bank"],
  ["prefs", "Ideal job"],
  ["rubric", "Fit criteria"],
  ["sources", "Email sources"],
];

function setupTab(t) { APP.setupTab = t; render(); }

function paneHead(title, blurb) {

}

// Which "needs" flag lights the dot on each tab.
const TAB_NEEDS = { key: ["key"], profile: ["profile", "fact_bank"], prefs: [], rubric: [], sources: ["sources"] };

function viewSetup() {
  if (!APP.setup) return `<div style="padding:40px 20px;color:var(--color-neutral-700)">Loading settings…</div>`;
  const needs = APP.setup.needs;
  const dot = `<span style="width:6px;height:6px;background:var(--color-accent);display:inline-block;margin-left:7px;vertical-align:middle"></span>`;

  const tabs = `<div style="display:flex;gap:2px;padding:0 20px;border-bottom:2px solid var(--color-divider);flex-wrap:wrap">
    ${SETUP_TABS.map(([k, label]) => `<button class="btn" style="border:0;border-bottom:3px solid ${APP.setupTab === k ? "var(--color-accent)" : "transparent"};border-radius:0;font-size:13px;padding:12px 14px;font-weight:${APP.setupTab === k ? "700" : "400"}" onclick="setupTab('${k}')">${esc(label)}${TAB_NEEDS[k].some(n => needs[n]) ? dot : ""}</button>`).join("")}
  </div>`;

  const panes = { key: paneKey, profile: paneProfile, prefs: panePrefs, rubric: paneRubric, sources: paneSources };
  return tabs + `<div style="max-width:1000px;padding:26px 20px 90px">${panes[APP.setupTab]()}</div>`;
}

// --- pane: API key ---
function paneKey() {
  const k = APP.setup.key;
  const status = k.configured
    ? `<span class="tag tag-outline">configured</span> <span style="font-family:monospace;font-size:12.5px">${esc(k.masked)}</span>
       <span style="font-size:12px;color:var(--color-neutral-700)">from ${k.source === "env-file" ? ".env" : "an environment variable"}</span>`
    : `<span class="tag tag-accent">not set</span>`;
  // When the live key comes from a real environment variable, writing .env will
  // not change what the app uses (load_dotenv never overrides one). Saying so
  // beats letting someone save repeatedly and wonder why nothing changes.
  const envWarning = k.source === "environment"
    ? `<div style="margin-top:10px;padding:10px 12px;background:var(--color-neutral-100);font-size:12.5px;border-left:3px solid var(--color-accent)">
         The key in use comes from an environment variable, which takes priority over <code>.env</code>.
         Saving here writes <code>.env</code>, but the environment variable will keep winning until it is unset.
       </div>` : "";
  return paneHead("DeepSeek API key",
    `Every stage calls one provider. The key is written to <code>.env</code> in the project root, which is gitignored, so it never enters the repo. A real environment variable still takes priority.`)
    + `<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">${status}</div>
    ${envWarning}
    <div class="field" style="max-width:520px;margin-top:16px"><label>API key</label>
      <input id="s_key" class="input" type="password" placeholder="sk-…" autocomplete="off">
    </div>
    <div style="font-size:12px;color:var(--color-neutral-700);margin-top:6px">Get one at <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">platform.deepseek.com/api_keys</a></div>
    <hr class="hr">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="saveKey()">Save key</button>
      <button class="btn btn-secondary" onclick="testKey()" ${k.configured ? "" : "disabled"}>Test key</button>
      <span id="keyresult" style="font-size:12.5px;color:var(--color-neutral-700)"></span>
    </div>`;
}

async function saveKey() {
  const key = val("s_key");
  if (!key) return toast("Paste a key first.");
  try {
    await api("/api/settings/key", jsonReq("POST", { key }));
    await loadSetup(false); toast("Key saved."); render();
  } catch (e) { toast("Could not save key."); }
}

async function testKey() {
  const el = $("keyresult"); el.textContent = "testing…";
  try {
    const r = await api("/api/settings/key/test", { method: "POST" });
    el.textContent = r.ok ? `✓ key works — model replied "${r.reply}"` : `✗ ${r.error}`;
    el.style.color = r.ok ? "var(--color-accent)" : "var(--color-neutral-800)";
  } catch (e) { el.textContent = "✗ request failed"; }
}

// --- pane: profile + fact bank ---
const DOC_FIELD = { profile: "s_profile", factbank: "s_factbank" };

function paneProfile() {
  const p = APP.setup.profile, f = APP.setup.fact_bank;
  const flag = (d) => !d.exists ? `<span class="tag tag-accent">missing</span>`
    : d.is_example ? `<span class="tag tag-accent">still the example</span>`

    + `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><h3 style="margin:0;font-size:15px">Profile</h3>${flag(p)}
       <button class="btn btn-secondary" style="margin-left:auto;font-size:12px;padding:5px 10px" onclick="loadDoc('profile')">Reload</button></div>
    <textarea id="s_profile" class="input" style="min-height:200px;font-size:13px;line-height:1.55" placeholder="Loading…"></textarea>
    <div style="margin-top:10px"><button class="btn btn-primary" onclick="saveDoc('profile')">Save profile</button></div>
    <hr class="hr">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><h3 style="margin:0;font-size:15px">Fact bank</h3>${flag(f)}
       <button class="btn btn-secondary" style="margin-left:auto;font-size:12px;padding:5px 10px" onclick="loadDoc('factbank')">Reload</button></div>
    <div style="padding:12px;background:var(--color-neutral-100);margin-bottom:12px">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">Build it from a resume you already have</div>
      <div style="font-size:12.5px;color:var(--color-neutral-800);margin-bottom:10px">Upload a <code>.docx</code> or <code>.pdf</code>. It is read, turned into a fact bank, and shown below <strong>for you to review</strong>. Nothing is saved until you press Save. Anything the resume was vague about comes back marked <code>(verify)</code>.</div>
      <button class="btn btn-secondary" onclick="pickFactBank()" ${APP.setupBusy ? "disabled" : ""}>${APP.setupBusy === "extract" ? "Reading resume…" : "Upload a resume"}</button>
    </div>
    <textarea id="s_factbank" class="input" style="min-height:280px;font-size:13px;line-height:1.55" placeholder="Loading…"></textarea>
    <div style="margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="saveDoc('factbank')">Save fact bank</button>
      <span style="font-size:12px;color:var(--color-neutral-700)">Review every line before saving. The grounding check treats this as ground truth.</span>
    </div>`;
}

async function loadDoc(which) {
  const d = await api(`/api/settings/${which}`);
  const el = $(DOC_FIELD[which]); if (el) el.value = d.content || "";
}

// Both textareas are filled after the pane paints, so opening Setup never shows
// an empty box that looks like an empty file.
//
// ONLY fills a box that is currently empty. render() runs on every save and on
// the upload flow, and these loads are async — without the guard a fetch started
// before a re-render would land afterwards and overwrite whatever you had just
// typed or just extracted.
function hydrateDocs() {
  if (APP.view !== "setup" || APP.setupTab !== "profile") return;
  ["profile", "factbank"].forEach(which => {
    const el = $(DOC_FIELD[which]);
    if (el && !el.value) loadDoc(which).catch(() => {});
  });
}

async function saveDoc(which) {
  const el = $(DOC_FIELD[which]); if (!el) return;
  const mine = el.value;
  const other = which === "profile" ? "factbank" : "profile";
  const theirs = $(DOC_FIELD[other]) ? $(DOC_FIELD[other]).value : null;
  const d = await api(`/api/settings/${which}`, jsonReq("PUT", { content: mine }));
  await loadSetup(false);
  toast(`Saved (${d.chars} chars).`);
  render();
  // Restore both textareas: re-rendering refreshes the "still the example" flag,
  // and a blind hydrate would throw away an unsaved edit in the other box.
  if ($(DOC_FIELD[which])) $(DOC_FIELD[which]).value = mine;
  if (theirs !== null && $(DOC_FIELD[other])) $(DOC_FIELD[other]).value = theirs;
}

function pickFactBank() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".docx,.pdf";
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    const keepProfile = $("s_profile") ? $("s_profile").value : null;
    APP.setupBusy = "extract"; render();
    if (keepProfile !== null && $("s_profile")) $("s_profile").value = keepProfile;
    try {
      const fd = new FormData(); fd.append("file", file);
      const res = await fetch("/api/settings/factbank/extract", { method: "POST", body: fd });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.detail || "extraction failed");
      APP.setupBusy = ""; render();
      if (keepProfile !== null && $("s_profile")) $("s_profile").value = keepProfile;
      const el = $("s_factbank");
      if (el) { el.value = body.content; el.focus(); el.setSelectionRange(0, 0); el.scrollIntoView({ block: "center" }); }
      toast("Extracted — review it, then press Save.");
    } catch (e) {
      APP.setupBusy = ""; render();
      toast(String(e.message || e).slice(0, 140));
    }
  };
  inp.click();
}

// --- pane: ideal job ---
function panePrefs() {
  const p = APP.setup.preferences;

    ["target_titles", "Target titles", "Machine Learning Engineer, Data Scientist"],

    ["seniority", "Target seniority", "graduate, junior"],

    ["nice_to_have_skills", "Nice-to-have skills", "PyTorch, AWS"],
    ["dealbreakers", "Dealbreakers", "requires security clearance, unpaid"],
    ["tracks", "Tracks to classify into", "ml-engineer, data-scientist, data-analyst"],
  ];

  return paneHead("What an ideal job looks like",
    `These go into the fit-scoring prompt. They used to be one hardcoded line reading "location (Sydney/remote-AU)", so anyone not in Sydney was quietly mis-scored. Comma-separate each list; leave a field empty to drop it from the prompt entirely.`)
    + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px 24px">
      ${F.map(([k, label, ph]) => `<div class="field"><label>${esc(label)}</label>
        <input id="p_${k}" class="input" placeholder="${esc(ph)}" value="${esc((p[k] || []).join(", "))}"></div>`).join("")}
      <div class="field"><label>Salary floor</label>

      <div class="field"><label>Currency</label>
        <input id="p_salary_currency" class="input" placeholder="AUD" value="${esc(p.salary_currency || "AUD")}"></div>
      <div class="field" style="grid-column:span 2"><label>Work arrangement</label>
        <div class="seg">${remote.map(r => `<label class="seg-opt"><input type="radio" name="rp" value="${r}" ${p.remote_policy === r ? "checked" : ""}><span>${r}</span></label>`).join("")}</div>
      </div>
    </div>
    <hr class="hr">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="savePrefs()">Save preferences</button>

}

async function savePrefs() {
  const sel = document.querySelector('input[name="rp"]:checked');
  const body = {
    target_titles: listVal("p_target_titles"), locations: listVal("p_locations"),
    seniority: listVal("p_seniority"), must_have_skills: listVal("p_must_have_skills"),
    nice_to_have_skills: listVal("p_nice_to_have_skills"), dealbreakers: listVal("p_dealbreakers"),
    tracks: listVal("p_tracks"),
    salary_floor: val("p_salary_floor") ? Number(val("p_salary_floor")) : null,
    salary_currency: val("p_salary_currency") || "AUD",
    remote_policy: sel ? sel.value : "any",
  };
  try { await api("/api/settings/preferences", jsonReq("PUT", body)); await loadSetup(false); toast("Preferences saved."); }
  catch (e) { toast("Could not save — check the fields."); }
}

// --- pane: fit criteria ---
function paneRubric() {
  const r = APP.setup.rubric;
  return paneHead("How fit is judged",
    `Weights are normalised and written into the scoring prompt as percentages. The bands are calibration anchors: they are what keeps a 70 meaning roughly the same thing across different roles. The board colours jobs by these thresholds too.`)
    + `<h3 style="margin:0 0 10px;font-size:15px">Weights</h3>
    <div id="weights">${r.dimensions.map(d => `
      <div style="display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--color-divider)">
        <span style="flex:0 0 220px;font-size:13.5px">${esc(d.label)}</span>
        <input type="range" min="0" max="100" value="${d.weight}" data-key="${esc(d.key)}" data-label="${esc(d.label)}"
               class="wslider" style="flex:1;accent-color:var(--color-accent)" oninput="syncWeights()">
        <span class="wpct" style="flex:0 0 70px;text-align:right;font-size:12.5px;color:var(--color-neutral-700)"></span>
      </div>`).join("")}
    </div>
    <div style="font-size:12px;color:var(--color-neutral-700);margin-top:8px">Set a weight to 0 to drop that factor from the prompt entirely.</div>
    <hr class="hr">
    <h3 style="margin:0 0 10px;font-size:15px">Score bands</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px 24px">
      <div class="field"><label>Strong match — at or above</label><input id="r_strong" class="input" type="number" min="1" max="100" value="${r.strong_min}"></div>
      <div class="field"><label>Worth considering — at or above</label><input id="r_possible" class="input" type="number" min="0" max="99" value="${r.possible_min}"></div>
      <div class="field" style="grid-column:span 2"><label>What those bands mean to you (optional)</label>
        <textarea id="r_notes" class="input" style="min-height:70px;font-size:13px">${esc(r.band_notes)}</textarea></div>
      <div class="field" style="grid-column:span 2"><label>Additional criteria — free text, appended to the prompt</label>
        <textarea id="r_extra" class="input" style="min-height:90px;font-size:13px" placeholder="e.g. Prefer teams that ship models to production. Penalise pure consultancies.">${esc(r.extra_criteria)}</textarea></div>
    </div>
    <hr class="hr">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="saveRubric()">Save criteria</button>
      <button class="btn btn-secondary" onclick="previewRubric()">Preview the prompt</button>
      <button class="btn btn-secondary" onclick="resetRubric()">Reset to defaults</button>
      <span id="rescoreline" style="font-size:12.5px;color:var(--color-neutral-700);margin-left:auto">${APP.rescoring ? "▸ " + esc(APP.rescoreMsg) : ""}</span>
      <button class="btn btn-secondary" onclick="runRescore()" ${APP.rescoring ? "disabled" : ""}>${APP.rescoring ? "Rescoring…" : "Rescore the board"}</button>
    </div>
    <pre id="rubricpreview" style="display:none;margin-top:18px;padding:14px;background:var(--color-neutral-100);font-size:12px;line-height:1.5;white-space:pre-wrap;max-height:420px;overflow:auto"></pre>`;
}

// Live percentages without a re-render — a full render() here would drop the
// slider mid-drag.
function syncWeights() {
  const sliders = [...document.querySelectorAll(".wslider")];
  const total = sliders.reduce((a, s) => a + Number(s.value), 0);
  const pcts = document.querySelectorAll(".wpct");
  sliders.forEach((s, i) => {
    const v = Number(s.value);
    pcts[i].textContent = v === 0 ? "ignored" : total ? `${Math.round(v * 100 / total)}%` : "–";
  });
}

function readRubric() {
  return {
    dimensions: [...document.querySelectorAll(".wslider")].map(s => ({
      key: s.dataset.key, label: s.dataset.label, weight: Number(s.value) })),
    strong_min: Number(val("r_strong")), possible_min: Number(val("r_possible")),
    band_notes: $("r_notes").value, extra_criteria: $("r_extra").value,
  };
}

async function saveRubric() {
  try {
    await api("/api/settings/rubric", jsonReq("PUT", readRubric()));
    await loadSetup(false); toast("Criteria saved."); render();
  } catch (e) {
    toast("Rejected — 'worth considering' must be below 'strong match'.");
  }
}

async function previewRubric() {
  const pre = $("rubricpreview");
  try {
    const r = await api("/api/settings/rubric/preview", jsonReq("POST", readRubric()));
    pre.textContent = r.prompt; pre.style.display = "block";
  } catch (e) { toast("Fix the score bands first."); }
}

async function resetRubric() {
  if (!confirm("Reset weights, bands, and your extra criteria to the defaults?")) return;
  // An empty object takes every server-side default, so the defaults live in one
  // place (schemas.py) rather than being duplicated here.
  await api("/api/settings/rubric", jsonReq("PUT", {}));
  await loadSetup(false); toast("Reset to defaults."); render();
}

async function runRescore() {
  const est = await api("/api/jobs/rescore/estimate");
  if (!est.jobs) return toast("No scored jobs to rescore.");
  if (!confirm(`Rescore ${est.jobs} job${est.jobs > 1 ? "s" : ""} against the saved criteria?\n\nThat is ${est.calls} LLM call${est.calls > 1 ? "s" : ""} on the cheap tier.`)) return;
  try { await api("/api/jobs/rescore", jsonReq("POST", { only_scored: true })); }
  catch (e) { return toast(String(e.message || e).slice(0, 160)); }
  APP.rescoring = true; APP.rescoreMsg = "starting…"; render();
  poll("/api/jobs/rescore/status", s => {
    APP.rescoreMsg = `${s.scored}/${s.total} ${s.message || ""}`;
    const line = $("rescoreline"); if (line) line.textContent = "▸ " + APP.rescoreMsg;
  }, s => {
    APP.rescoring = false;
    toast(s.error ? `Rescore failed: ${s.error}` : `Rescored ${s.scored} job${s.scored === 1 ? "" : "s"}.`);
    render();
  });
}

// Shared poller for the three background jobs. onTick must not call render():
// it patches one element, so an open form keeps its focus and contents.
function poll(url, onTick, onDone, ms = 900) {
  const t = setInterval(async () => {
    let s; try { s = await api(url); } catch (e) { clearInterval(t); return; }
    onTick(s);
    if (s.done) { clearInterval(t); onDone(s); }
  }, ms);
}

// --- pane: email sources ---
function paneSources() {
  const saved = APP.setup.email_sources;
  const found = APP.scan.senders;
  const gmail = APP.setup.gmail_ready;

  const savedRows = saved.length ? saved.map((s, i) => `
    <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--color-divider)">
      <input type="checkbox" class="srcbox" data-value="${esc(s.value)}" data-label="${esc(s.label)}" data-origin="${esc(s.origin)}" ${s.enabled ? "checked" : ""} style="accent-color:var(--color-accent)">
      <span style="font-size:13.5px">${esc(s.value)}</span>
      ${s.label ? `<span style="font-size:12px;color:var(--color-neutral-700)">${esc(s.label)}</span>` : ""}
      <span class="tag tag-neutral" style="margin-left:auto">${esc(s.origin)}</span>
      <button class="btn btn-ghost" style="font-size:16px;line-height:1;padding:2px 8px" onclick="dropSource(${i})" title="remove">×</button>
    </div>`).join("")
    : `<div style="font-size:13px;color:var(--color-neutral-700);padding:8px 0">
         Nothing configured, so ingest uses the built-in list:
         <span style="font-size:12px">${(APP.setup.effective_sources || []).map(v => esc(v)).join(", ")}</span>
       </div>`;

  const likely = found.filter(f => f.confidence !== "unknown");
  const shown = APP.scan.show === "all" ? found : likely;
  const scanRows = found.length ? `
    <div style="display:flex;align-items:center;gap:12px;margin:16px 0 6px;flex-wrap:wrap">
      <strong style="font-size:13.5px">${found.length} senders found</strong>
      <span style="font-size:12.5px;color:var(--color-neutral-700)">${likely.length} look like job alerts</span>
      <button class="btn btn-secondary" style="font-size:12px;padding:5px 10px;margin-left:auto" onclick="APP.scan.show='${APP.scan.show === "all" ? "likely" : "all"}';render()">
        ${APP.scan.show === "all" ? "Show likely only" : `Show all ${found.length}`}
      </button>
    </div>
    ${shown.length ? shown.map(f => `
      <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--color-divider);${f.already_added ? "opacity:.5" : ""}">
        <input type="checkbox" class="scanbox" data-value="${esc(f.domain)}" data-label="${esc(f.display_name)}"
               ${f.confidence !== "unknown" && !f.already_added ? "checked" : ""} ${f.already_added ? "disabled" : ""} style="accent-color:var(--color-accent)">
        <span style="font-size:13.5px">${esc(f.domain)}</span>
        <span style="font-size:12px;color:var(--color-neutral-700)">${esc(f.display_name)} · ${f.count} email${f.count === 1 ? "" : "s"}</span>
        ${f.already_added ? `<span class="tag tag-neutral" style="margin-left:auto">already added</span>`
          : f.confidence === "heuristic" ? `<span class="tag tag-outline" style="margin-left:auto">job board</span>`
          : f.confidence === "llm" ? `<span class="tag tag-accent" style="margin-left:auto">suggested</span>`
          : `<span class="tag tag-neutral" style="margin-left:auto">unknown</span>`}
      </div>
      ${f.sample_subjects.length ? `<div style="font-size:11.5px;color:var(--color-neutral-600);padding:0 0 6px 32px">${f.sample_subjects.map(s => esc(s)).join(" · ")}</div>` : ""}
    `).join("") : `<div style="font-size:13px;color:var(--color-neutral-700);padding:8px 0">None of the senders looked like job alerts. Try "Show all", or add one by hand below.</div>`}
    <div style="margin-top:12px"><button class="btn btn-primary" onclick="addScanned()">Add ticked senders</button></div>` : "";

  return paneHead("Which emails to scrape",
    `Ingest reads job alerts from Gmail. Scan your inbox to find the senders automatically, or add one by hand. ${saved.length ? "" : "<strong>Nothing is configured yet, so ingest is using the built-in job-board list.</strong>"}`)
    + `<h3 style="margin:0 0 8px;font-size:15px">Scan your inbox</h3>
    ${gmail ? `
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-size:12.5px;color:var(--color-neutral-800)">Sweeps the last</span>
        <div class="seg">${[30, 90, 180].map(d => `<label class="seg-opt"><input type="radio" name="sd" value="${d}" ${d === 90 ? "checked" : ""} ${APP.scan.running ? "disabled" : ""}><span>${d}d</span></label>`).join("")}</div>
        <span style="font-size:12.5px;color:var(--color-neutral-800)">of your Updates tab.</span>
        <button class="btn btn-secondary" style="margin-left:auto" onclick="runScan()" ${APP.scan.running ? "disabled" : ""}>${APP.scan.running ? "Scanning…" : "Scan inbox"}</button>
      </div>
      <div id="scanline" style="font-size:12.5px;color:var(--color-neutral-700);margin-top:8px">${APP.scan.running ? "▸ " + esc(APP.scan.msg) : "Reads only sender and subject headers, never message bodies. A wide window takes a while."}</div>`
    : `<div style="padding:12px;background:var(--color-neutral-100);font-size:13px">
         Gmail is not authorised yet. Run <code>python -m pipeline</code> once in your terminal to sign in — a browser fetch cannot complete Google's consent flow — then come back and scan.
       </div>`}
    ${scanRows}
    <hr class="hr">
    <h3 style="margin:0 0 8px;font-size:15px">Add one by hand</h3>
    <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
      <div class="field" style="flex:1 1 300px;max-width:420px"><label>Address or domain</label>
        <input id="src_new" class="input" placeholder="jobs@company.com   or   seek.com.au" onkeydown="if(event.key==='Enter')addSource()"></div>
      <button class="btn btn-secondary" onclick="addSource()">Add</button>
    </div>
    <hr class="hr">
    <h3 style="margin:0 0 8px;font-size:15px">Senders being scraped</h3>
    ${savedRows}
    <div style="margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="saveSources()">Save sources</button>
      <span style="font-size:12px;color:var(--color-neutral-700)">Unticking keeps a sender in the list but excludes it from the Gmail query.</span>
    </div>`;
}

// Saved-list edits are staged in APP.setup and only persisted by Save, so a
// mis-click is undone by leaving the pane.
function dropSource(i) { APP.setup.email_sources.splice(i, 1); render(); }

// Mirrors EmailSource._normalise on the server, so the duplicate check here
// agrees with the one that actually de-duplicates on save.
function normSource(v) {
  v = (v || "").trim().toLowerCase();
  if (v.includes("<") && v.includes(">")) v = v.slice(v.indexOf("<") + 1, v.indexOf(">")).trim();
  return v.replace(/^@/, "");
}

function addSource() {
  const v = normSource(val("src_new"));
  if (!v) return;
  if (APP.setup.email_sources.some(s => normSource(s.value) === v)) return toast("Already in the list.");
  APP.setup.email_sources.push({ value: v, label: "", enabled: true, origin: "manual" });
  render();
}

function addScanned() {
  const picked = [...document.querySelectorAll(".scanbox")].filter(b => b.checked && !b.disabled);
  if (!picked.length) return toast("Tick at least one sender.");
  const have = new Set(APP.setup.email_sources.map(s => normSource(s.value)));
  let added = 0;
  picked.forEach(b => {
    const v = normSource(b.dataset.value);
    if (have.has(v)) return;
    APP.setup.email_sources.push({ value: v, label: b.dataset.label, enabled: true, origin: "scan" });
    have.add(v); added++;
  });
  toast(added ? `${added} added — press Save sources to keep them.` : "Those are already in the list.");
  render();
}

async function saveSources() {
  // Read the tick state back off the DOM so enable/disable toggles are picked up.
  const sources = [...document.querySelectorAll(".srcbox")].map(b => ({
    value: b.dataset.value, label: b.dataset.label,
    enabled: b.checked, origin: b.dataset.origin || "manual" }));
  try {
    await api("/api/settings/senders", jsonReq("PUT", { sources }));
    await loadSetup(false);
    toast(`Saved — ${sources.filter(s => s.enabled).length} sender(s) active.`);
    render();
  } catch (e) { toast("Could not save sources."); }
}

async function runScan() {
  const sel = document.querySelector('input[name="sd"]:checked');
  const days = sel ? Number(sel.value) : 90;
  try { await api("/api/settings/senders/scan", jsonReq("POST", { days })); }
  catch (e) { return toast(String(e.message || e).slice(0, 180)); }
  APP.scan.running = true; APP.scan.msg = "starting…"; APP.scan.senders = []; render();
  poll("/api/settings/senders/scan/status", s => {
    APP.scan.msg = s.message || `scanned ${s.scanned || 0}…`;
    const line = $("scanline"); if (line) line.textContent = "▸ " + APP.scan.msg;
  }, s => {
    APP.scan.running = false;
    APP.scan.senders = s.senders || [];
    if (s.error) toast(`Scan failed: ${s.error}`);
    else toast(`Found ${APP.scan.senders.length} senders.`);
    render();
  });
}

// Boot: settings first, so the banner and the board's score bands are correct on
// the first paint rather than flickering in a moment later.
loadSetup(false).catch(() => {}).finally(loadBoard);
</script>
