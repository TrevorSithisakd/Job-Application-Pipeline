<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Application Pipeline</title>
<style>
  :root {
    --bg: #0e1117; --panel: #171b24; --panel2: #1e232e; --border: #2a3140;
    --text: #e6e9ef; --muted: #9aa4b2; --accent: #4c8dff; --accent2: #3a6fd8;
    --good: #2ecc71; --warn: #f0a020; --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }
  .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  /* Sidebar */
  .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .sidebar header { padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .sidebar h1 { font-size: 15px; margin: 0; letter-spacing: .3px; }
  .sidebar .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .joblist { overflow-y: auto; flex: 1; }
  .job {
    padding: 12px 18px; border-bottom: 1px solid var(--border); cursor: pointer;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .job:hover { background: var(--panel); }
  .job.active { background: var(--panel2); border-left: 3px solid var(--accent); padding-left: 15px; }
  .job .body { flex: 1; min-width: 0; }
  .job .co { font-weight: 600; }
  .job .ti { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { font-weight: 700; font-size: 13px; padding: 2px 8px; border-radius: 20px; background: var(--panel2); }
  .score.hi { color: var(--good); } .score.mid { color: var(--warn); } .score.lo { color: var(--muted); }
  /* Main */
  .main { overflow-y: auto; padding: 26px 32px; }
  .empty { color: var(--muted); margin-top: 20vh; text-align: center; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .head h2 { margin: 0 0 4px; font-size: 20px; }
  .head .co { color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .chip { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font-size: 12px; color: var(--muted); }
  .chip a { color: var(--accent); text-decoration: none; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 24px 0 10px; }
  .jd { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; white-space: pre-wrap; color: #cfd6e0; }
  textarea.jd-edit { width: 100%; min-height: 200px; resize: vertical; font: inherit; line-height: 1.5; }
  .hint { text-transform: none; font-weight: 400; color: var(--muted); font-size: 11px; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 7px; padding: 9px 16px;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  button:hover { background: var(--accent2); }
  button:disabled { opacity: .55; cursor: default; }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .resume { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
  .resume .top { display: flex; align-items: center; gap: 10px; }
  .resume .ver { font-weight: 700; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .badge.good { background: rgba(46,204,113,.15); color: var(--good); }
  .badge.bad { background: rgba(255,92,92,.15); color: var(--bad); }
  .badge.appr { background: rgba(76,141,255,.18); color: var(--accent); }
  .resume .actions { margin-left: auto; display: flex; gap: 8px; }
  .flags { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .flags .f { color: var(--bad); font-size: 12.5px; margin: 4px 0; }
  a.dl { text-decoration: none; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--border); padding: 12px 18px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header>
      <h1>Job Application Pipeline</h1>
      <div class="sub" id="jobcount">Loading…</div>
    </header>
    <div class="joblist" id="joblist"></div>
  </aside>
  <main class="main" id="main">
    <div class="empty">Select a job to see its description and tailored resumes.</div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let JOBS = [], activeId = null;

const scoreClass = (s) => s == null ? 'lo' : s >= 75 ? 'hi' : s >= 50 ? 'mid' : 'lo';
const esc = (s) => (s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

async function loadJobs() {
  JOBS = await (await fetch('/api/jobs')).json();
  $('jobcount').textContent = `${JOBS.length} roles ingested`;
  $('joblist').innerHTML = JOBS.map(j => `
    <div class="job ${j.id === activeId ? 'active' : ''}" onclick="openJob(${j.id})">
      <div class="body">
        <div class="co">${esc(j.company)}</div>
        <div class="ti">${esc(j.title)}</div>
      </div>
      <div class="score ${scoreClass(j.fit_score)}">${j.fit_score ?? '–'}</div>
    </div>`).join('');
}

async function openJob(id) {
  activeId = id;
  document.querySelectorAll('.job').forEach(e => e.classList.remove('active'));
  await loadJobs();
  const job = await (await fetch(`/api/jobs/${id}`)).json();
  renderJob(job);
}

function renderJob(job) {
  const meta = [
    job.track && `<span class="chip">${esc(job.track)}</span>`,
    job.location && `<span class="chip">${esc(job.location)}</span>`,
    job.salary && `<span class="chip">${esc(job.salary)}</span>`,
    job.url && `<span class="chip"><a href="${esc(job.url)}" target="_blank">Open posting ↗</a></span>`,
  ].filter(Boolean).join('');

  $('main').innerHTML = `
    <div class="head">
      <div>
        <h2>${esc(job.title)}</h2>
        <div class="co">${esc(job.company)}</div>
      </div>
      <button id="tailorBtn" onclick="tailor(${job.id})">✨ Tailor resume</button>
    </div>
    <div class="meta">${meta || '<span class="chip">no metadata</span>'}</div>
    ${job.fit_rationale ? `<h3>Fit rationale (${job.fit_score})</h3><div class="jd">${esc(job.fit_rationale)}</div>` : ''}
    <h3>Job description <span class="hint">— alerts only carry a teaser; paste the full JD from the posting, Save, then Tailor</span></h3>
    <textarea id="jdText" class="jd jd-edit" placeholder="Paste the full job description here…">${esc(job.jd_text)}</textarea>
    <div style="margin-top:8px"><button class="ghost" onclick="saveJd(${job.id})">Save JD</button></div>
    <h3>Tailored resumes</h3>
    <div id="resumes">${renderResumes(job.resumes)}</div>`;
}

function renderResumes(resumes) {
  if (!resumes || !resumes.length) return '<div class="chip">None yet — click “Tailor resume”.</div>';
  return resumes.map(r => `
    <div class="resume">
      <div class="top">
        <span class="ver">v${r.version}</span>
        ${r.grounded === 1 ? '<span class="badge good">grounded</span>'
          : r.grounded === 0 ? '<span class="badge bad">flagged claims</span>' : ''}
        ${r.approved ? '<span class="badge appr">approved</span>' : ''}
        <div class="actions">
          ${r.grounded === 0 ? `<button class="ghost" onclick="showFlags(${r.id}, this)">View flags</button>` : ''}
          <a class="dl" href="/api/resumes/${r.id}/docx"><button class="ghost">Download .docx</button></a>
          ${r.approved ? '' : `<button onclick="approve(${r.id})">Approve</button>`}
        </div>
      </div>
      <div class="flags" id="flags-${r.id}" style="display:none"></div>
    </div>`).join('');
}

async function saveJd(jobId) {
  const jd = document.getElementById('jdText').value;
  const res = await fetch(`/api/jobs/${jobId}/jd`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jd_text: jd }),
  });
  if (res.ok) { const d = await res.json(); toast(`JD saved (${d.chars} chars).`); }
  else toast('Save failed.');
}

async function tailor(jobId) {
  const btn = $('tailorBtn');
  btn.disabled = true; btn.textContent = 'Tailoring… (this calls the model, ~20s)';
  try {
    const res = await (await fetch(`/api/jobs/${jobId}/tailor`, { method: 'POST' })).json();
    toast(res.grounded ? `v${res.version} drafted — all claims grounded ✓`
                       : `v${res.version} drafted — ${res.flagged.length} flagged claim(s)`);
    openJob(jobId);
  } catch (e) {
    toast('Tailoring failed — check the server console.');
    btn.disabled = false; btn.textContent = '✨ Tailor resume';
  }
}

async function approve(resumeId) {
  await fetch(`/api/resumes/${resumeId}/approve`, { method: 'POST' });
  toast('Approved.');
  openJob(activeId);
}

async function showFlags(resumeId, btn) {
  const el = $(`flags-${resumeId}`);
  if (el.style.display === 'block') { el.style.display = 'none'; return; }
  const r = await (await fetch(`/api/resumes/${resumeId}`)).json();
  const flagged = (r.grounding?.claims || []).filter(c => !c.supported);
  el.innerHTML = flagged.length
    ? flagged.map(c => `<div class="f">⚠ ${esc(c.claim)}</div>`).join('')
    : '<div class="chip">No unsupported claims.</div>';
  el.style.display = 'block';
}

loadJobs();
</script>
</body>
</html>
